//    testImplementation 'io.micronaut:micronaut-http-client'

    // Testing
    testImplementation 'ru.vyarus:spock-junit5:1.5.0'
    testImplementation 'io.zonky.test:embedded-postgres:2.0.3'
    testImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:11.19.0')
    testImplementation 'cloud.localstack:localstack-utils:0.2.23'
    // TEMP: Keep AWS SDK v1 full in tests during migration (Localstack utils may depend on it)
    testImplementation "com.amazonaws:aws-java-sdk:1.12.418"
    testImplementation 'com.palantir.docker.compose:docker-compose-junit-jupiter:2.3.0'
    testImplementation 'org.jasig.cas.client:cas-client-core:3.6.4'

