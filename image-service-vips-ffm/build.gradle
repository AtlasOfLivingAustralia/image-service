plugins {
    id 'groovy'
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://nexus.ala.org.au/content/groups/public/" }
    maven { url "https://jitpack.io" }
}

java {
    sourceCompatibility = JavaVersion.toVersion("22")
    targetCompatibility = JavaVersion.toVersion("22")
}

dependencies {
    implementation localGroovy()
    api 'org.slf4j:slf4j-api:1.7.36'
    implementation 'com.google.guava:guava:33.2.1-jre'
    compileOnly project(':image-utils')
    testImplementation project(':image-utils')

    // The lopcode vips-ffm library
    implementation 'app.photofox.vips-ffm:vips-ffm-core:1.9.5'

    // Testing
    testImplementation 'org.spockframework:spock-core:2.4-groovy-4.0'
    // 2. Required for mocking ANY concrete class (not just interfaces)
    testImplementation 'net.bytebuddy:byte-buddy:1.14.12'
    // 3. Required specifically for mocking FINAL classes via Spock 2.4+
    testImplementation 'org.mockito:mockito-core:5.11.0'
    // Optional: Required if your classes don't have default constructors
    testImplementation 'org.objenesis:objenesis:3.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs = [
//        '--enable-preview',
        '--enable-native-access=ALL-UNNAMED'
    ]
    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

compileGroovy {
//    options.compilerArgs << '--enable-preview'
}

tasks.withType(JavaCompile).configureEach {
//    options.compilerArgs << '--enable-preview'
}
