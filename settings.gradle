pluginManagement {
    repositories {
        mavenLocal()
        maven { url "https://nexus.ala.org.au/content/groups/public/" }
        mavenCentral()
        maven { url "https://repo.grails.org/grails/core/" }
        gradlePluginPortal()
    }

    plugins {
        id "org.apache.grails.gradle.grails-web" version "7.2.1"
        id "org.apache.grails.gradle.grails-gsp" version "7.2.1"
        id "org.apache.grails.gradle.grails-plugin" version "7.2.1"
        id "cloud.wondrify.asset-pipeline" version "5.0.32"
    }
}

rootProject.name = 'image-project'

include 'image-utils'
include 'image-utils-native-bridge'
include 'image-service'


// Our Grails App doesn't support Java 25 yet, so don't bother with the FFM modules for now.

