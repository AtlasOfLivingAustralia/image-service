AWSTemplateFormatVersion: "2010-09-09"

Description: Code pipeline for the images service

Parameters:
  pAllowTeardown:
    Description: enables or disables the teardown stage
    Type: String
    AllowedValues:
      - "true"
      - "false"

  pAutoDeploy:
    Description: Sets the pipeline to auto deploy on repo changes
    Type: String

  pBootstrapStackName:
    Description: the name of the bootstrap stack
    Type: String

  pBucketsStackName:
    Description: the name of the bucket stack
    Type: String

  pCleanBranch:
    Description: The clean branch, can be used in resource names
    Type: String

  pEnvironment:
    Description: The AWS environment this belongs to
    Type: String

  pGitHubBranch:
    Description: GitHub branch we're deploying from
    Type: String

  pGitHubOwner:
    Description: GitHub owner
    Type: String

  pGitHubRepositoryName:
    Description: GitHub repository name.
    Type: String

  pPipelineFingerprint:
    Description: The fingerprint of the pipeline, used to determine if it's been modified
    Type: String

  pProductComponent:
    Description: The name of the product component
    Type: String

  pProductName:
    Description: The name of the product
    Type: String

  pRestartExecutionOnUpdate:
    Description: Restart that pipeline if it's been updated
    Type: String
    AllowedValues:
      - "true"
      - "false"

Conditions:
  IsDev: !Equals
    - !Ref pEnvironment
    - development

  AutoDeploy: !Equals
    - !Ref pAutoDeploy
    - "true"

  AllowTeardown: !Equals
    - !Ref pAllowTeardown
    - "true"

Resources:
  ExportConfig:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub
        - ${pProductName}-${pProductComponent}-export-config-${ResourceName}
        - ResourceName: !If
            - IsDev
            - !Ref pCleanBranch
            - !Ref pEnvironment
      Description: Load the environment and build the CloudFormation template config file
      ServiceRole: !ImportValue
        Fn::Sub: ${pBootstrapStackName}-CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:8.0
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub cicd/${pProductComponent}/pipeline/export_config_buildspec.yaml
      TimeoutInMinutes: 5

  DeployNotification:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub
        - ${pProductName}-${pProductComponent}-deploy-notification-${ResourceName}
        - ResourceName: !If
            - IsDev
            - !Ref pCleanBranch
            - !Ref pEnvironment
      Description: Send out the deploy notifications
      ServiceRole: !ImportValue
        Fn::Sub: ${pBootstrapStackName}-CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:8.0
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub cicd/${pProductComponent}/pipeline/deploy_notification_buildspec.yaml
      TimeoutInMinutes: 5

  EmptyBucket:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub
        - ${pProductName}-${pProductComponent}-empty-bucket-${ResourceName}
        - ResourceName: !If
            - IsDev
            - !Ref pCleanBranch
            - !Ref pEnvironment
      Description: Empty s3 bucket for teardown
      ServiceRole: !ImportValue
        Fn::Sub: ${pBootstrapStackName}-CodeBuildServiceRoleArn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:8.0
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub cicd/${pProductComponent}/pipeline/empty_bucket_buildspec.yaml
      TimeoutInMinutes: 5

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub
        - ${pProductName}-${pProductComponent}-${ResourceName}
        - ResourceName: !If
            - IsDev
            - !Ref pCleanBranch
            - !Ref pEnvironment
      PipelineType: V2
      RoleArn: !ImportValue
        Fn::Sub: ${pBootstrapStackName}-CodePipelineServiceRoleArn
      ArtifactStore:
        Type: S3
        Location: !ImportValue
          Fn::Sub: ${pBucketsStackName}-${AWS::Region}-CodePipelineArtifactBucketName
      DisableInboundStageTransitions: !If
        - AllowTeardown
        - - Reason: To prevent accidental teardown
            StageName: Teardown
        - !Ref AWS::NoValue
      RestartExecutionOnUpdate: !Ref pRestartExecutionOnUpdate
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            Push:
              - Branches:
                  Includes:
                    - !If
                      - AutoDeploy
                      - !Ref pGitHubBranch
                      - bogo-branch
                FilePaths:
                  Includes:
                    - !Sub cicd/${pProductComponent}/**
            SourceActionName: CheckoutSrc
      Variables:
        - Name: SRC_BRANCH
          DefaultValue: !Ref pGitHubBranch
          Description: The branch this pipeline is deploying from
        - Name: PIPELINE_FINGERPRINT
          DefaultValue: !Ref pPipelineFingerprint
          Description: The fingerprint of the pipeline, used to determine if it's been modified
      Stages:
        - Name: Checkout_Source
          Actions:
            - Name: CheckoutSrc
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: 1
              Configuration:
                ConnectionArn: !ImportValue
                  Fn::Sub: ${pBootstrapStackName}-CodestarConnectionArn
                FullRepositoryId: !Sub ${pGitHubOwner}/${pGitHubRepositoryName}
                BranchName: !Ref pGitHubBranch
                OutputArtifactFormat: CODEBUILD_CLONE_REF
                DetectChanges: !Ref pAutoDeploy
              Namespace: CheckoutSrcNS
              OutputArtifacts:
                - Name: SourceArtifact
        - Name: Deploy_Infrastructure_Build
          Actions:
            - Name: ExportConfig
              ActionTypeId:
                Owner: AWS
                Category: Build
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref ExportConfig
                EnvironmentVariables: !Sub
                  - |
                    [
                      { "name":"ARTIFACTS_BUCKET", "value":"${ArtifactsBucket}" },
                      { "name":"CLEAN_BRANCH", "value":"${pCleanBranch}" },
                      { "name":"COMMIT_ID", "value":"#{CheckoutSrcNS.CommitId}" },
                      { "name":"ENVIRONMENT", "value":"${pEnvironment}" },
                      { "name":"PIPELINE_FINGERPRINT", "value":"#{variables.PIPELINE_FINGERPRINT}" },
                      { "name":"PRODUCT_COMPONENT", "value":"${pProductComponent}" },
                      { "name":"SRC_BRANCH", "value":"${pGitHubBranch}" }
                    ]
                  - ArtifactsBucket: !ImportValue
                      Fn::Sub: ${pBucketsStackName}-${AWS::Region}-CodePipelineArtifactBucketName
              Namespace: ExportConfigNS
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: ExportConfigArtifact
              RunOrder: 1
            - Name: DeployBaseCFStack
              ActionTypeId:
                Owner: AWS
                Category: Deploy
                Version: 1
                Provider: CloudFormation
              Configuration:
                TemplatePath: !Sub ExportConfigArtifact::cicd/${pProductComponent}/app/#{ExportConfigNS.BASE_STACK_FILE_PFIX}.yaml
                ActionMode: !If
                  - IsDev
                  - REPLACE_ON_FAILURE
                  - CREATE_UPDATE
                TemplateConfiguration: !Sub ExportConfigArtifact::cicd/${pProductComponent}/app/#{ExportConfigNS.BASE_STACK_FILE_PFIX}_template_config.json
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND,CAPABILITY_NAMED_IAM
                RoleArn: !ImportValue
                  Fn::Sub: ${pBootstrapStackName}-CloudFormationServiceRoleArn
                StackName: '#{ExportConfigNS.BASE_STACK_NAME}'
              InputArtifacts:
                - Name: ExportConfigArtifact
              Namespace: BaseCloudFormationOutNS
              OutputArtifacts: []
              RunOrder: 2
            - Name: DeployNotification
              ActionTypeId:
                Owner: AWS
                Category: Build
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref DeployNotification
              Namespace: DeployNotificationNS
              InputArtifacts:
                - Name: ExportConfigArtifact
              RunOrder: 3
        - !If
          - AllowTeardown
          - Name: Teardown
            Actions:
              - Name: Approval
                ActionTypeId:
                  Owner: AWS
                  Category: Approval
                  Version: 1
                  Provider: Manual
                Configuration:
                  CustomData: Approval required to tear down this stack
                RunOrder: 1
              - Name: EmptyBucket
                ActionTypeId:
                  Owner: AWS
                  Category: Build
                  Version: 1
                  Provider: CodeBuild
                Configuration:
                  ProjectName: !Ref EmptyBucket
                  EnvironmentVariables: |
                    [
                      { "name":"LOAD_BALANCER_ACCESS_LOGS_BUCKET", "value":"#{BaseCloudFormationOutNS.LoadBalancerAccessLogsBucket}" }
                    ]
                Namespace: EmptyBucketNS
                InputArtifacts:
                  - Name: ExportConfigArtifact
                OutputArtifacts:
                  - Name: EmptyBucketArtifact
                RunOrder: 2
              - Name: TeardownBaseStack
                ActionTypeId:
                  Owner: AWS
                  Category: Deploy
                  Version: 1
                  Provider: CloudFormation
                Configuration:
                  ActionMode: DELETE_ONLY
                  StackName: '#{ExportConfigNS.BASE_STACK_NAME}'
                  RoleArn: !ImportValue
                    Fn::Sub: ${pBootstrapStackName}-CloudFormationServiceRoleArn
                RunOrder: 3
              - Name: ApprovalForPipelineTeardown
                ActionTypeId:
                  Owner: AWS
                  Category: Approval
                  Version: 1
                  Provider: Manual
                Configuration:
                  CustomData: Approval required to tear down this stack
                RunOrder: 4
              - Name: TeardownCodePipeline
                ActionTypeId:
                  Owner: AWS
                  Category: Deploy
                  Version: 1
                  Provider: CloudFormation
                Configuration:
                  ActionMode: DELETE_ONLY
                  StackName: !Ref AWS::StackName
                  RoleArn: !ImportValue
                    Fn::Sub: ${pBootstrapStackName}-CloudFormationServiceRoleArn
                RunOrder: 5
          - !Ref AWS::NoValue

  ExportConfigCodeBuildLogGroup:
    DeletionPolicy: Delete
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/${ExportConfig}
      RetentionInDays: 30
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  NotificationCodeBuildLogGroup:
    DeletionPolicy: Delete
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/${DeployNotification}
      RetentionInDays: 30
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  EmptyBucketLogGroup:
    DeletionPolicy: Delete
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/${EmptyBucket}
      RetentionInDays: 30
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

Outputs:
  PipelineUrl:
    Value: !Sub https://console.aws.amazon.com/codepipeline/home?region=${AWS::Region}#/view/${Pipeline}
